[workspace]
resolver = "2"
members = ["wafid-core", "wafid-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rootx/wafid"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
regex = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
csv = "1"
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
